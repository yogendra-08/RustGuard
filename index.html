<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise 🎂</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-animation"></div>

    <div class="container">

        <!-- Left Side Photo -->
        <div class="photo-section">
            <div class="photo-frame">
                <img src="birthday-photo.jpg" alt="Birthday Person">
            </div>
        </div>

        <!-- Right Side PIN -->
        <div class="pin-section">
            <div class="pin-card">
                <h1>🎉 Birthday Surprise 🎉</h1>
                <p>Enter the Secret PIN to continue</p>

                <input type="password" id="pinInput" maxlength="4" placeholder="Enter PIN">

                <button onclick="checkPin()">Unlock ✨</button>

                <p id="message"></p>
            </div>
        </div>

    </div>

    <script>
        function checkPin() {
            const pin = document.getElementById("pinInput").value;
            const message = document.getElementById("message");

            if (pin === "0808") {
                message.style.color = "#7CFC00";
                message.innerText = "Access Granted! 🎂";
                
                setTimeout(() => {
                    window.location.href = "surprise.html";
                }, 1000);

            } else {
                message.style.color = "#ff4d6d";
                message.innerText = "Oops! Wrong PIN 😢";
            }
        }
    </script>

</body>
</html>
